[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promptlint"
version = "0.1.0"
description = "A linter for prompt and agent-instruction files (CLAUDE.md, AGENTS.md, system prompts)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Mohamed Ashrey" }]
keywords = ["prompt", "linter", "llm", "claude", "mcp", "ai", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
accurate = ["tiktoken>=0.5"]
toml = ["tomli>=2.0; python_version < '3.11'"]
dev = ["pytest>=7", "tiktoken>=0.5"]

[project.scripts]
promptlint = "promptlint.cli:main"

[project.urls]
Homepage = "https://github.com/M-Ashrey/promptlint"
Issues = "https://github.com/M-Ashrey/promptlint/issues"

[tool.setuptools.packages.find]
include = ["promptlint*"]

[tool.promptlint]
token_budget = 8000
ignore = ["long-line"]
